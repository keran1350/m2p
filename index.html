<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243b"><title>나의 5분할 운동 코치</title><style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#15263b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#10243b,#22658a);color:white;padding:24px 18px}header>div,main{max-width:950px;margin:auto}h1{font-size:25px;margin:0 0 7px}.sub{opacity:.8;font-size:13px}.days{display:flex;gap:7px;overflow-x:auto;padding:14px 0}.day{border:1px solid #cbd7e5;background:white;border-radius:12px;padding:12px 14px;white-space:nowrap;cursor:pointer;font-weight:700}.day.active{background:#16749e;color:white;border-color:#16749e}main{padding:0 15px 35px}.summary,.exercise,.panel{background:white;border:1px solid #e1e8ef;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 3px 10px #17344c08}.summary{display:flex;justify-content:space-between;align-items:center;gap:15px}.muted{color:#617184;font-size:13px}.progress{height:9px;border-radius:9px;background:#e7eef4;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#19a789;transition:width .2s}.exercise{padding:0;overflow:hidden}.exercise-head{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:16px;border:0;background:white;text-align:left;cursor:pointer;color:inherit}.exercise-head strong{font-size:16px}.exercise-head small{display:block;color:#697a8d;margin-top:5px}.pill{background:#e8f4f9;color:#166a8c;padding:6px 9px;border-radius:30px;font-size:12px;white-space:nowrap}.detail{padding:0 16px 17px;border-top:1px solid #edf0f4}.figure{background:#edf5fa;border-radius:12px;display:grid;place-items:center;margin:14px 0;padding:10px;min-height:215px}.figure svg{width:100%;max-width:360px;height:215px}.tip{font-size:14px;line-height:1.7}.tip b{color:#12688e}.setrow{display:grid;grid-template-columns:44px 1fr 1fr 58px;gap:8px;align-items:center;margin:9px 0}.setrow input{width:100%;min-width:0;border:1px solid #cdd8e3;border-radius:8px;padding:11px 6px;font-size:15px}.setrow button{border:1px solid #cbd9e4;background:#fff;border-radius:8px;padding:10px 3px;cursor:pointer}.setrow button.done{background:#0e997b;color:white;border-color:#0e997b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}button.action{border:0;background:#166e98;color:white;border-radius:9px;padding:10px 13px;cursor:pointer}.action.secondary{background:#e7eff4;color:#174563}footer{font-size:12px;color:#718093;text-align:center;padding:15px}.rest{padding:35px;text-align:center;color:#536579}.sectiontitle{font-size:19px;margin:22px 2px 6px}@media(min-width:700px){.exercise-head{padding:18px 22px}.detail{padding:0 22px 22px}}
input[type=date],input[type=month],select{max-width:100%;padding:8px;border:1px solid #cbd7e5;border-radius:8px;font:inherit}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calendar button{padding:9px 0;border:1px solid #ddd;background:white;border-radius:7px}.calendar .marked{background:#c7efdf;color:#075b43;font-weight:bold}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-bottom:1px solid #ddd;text-align:left}details{margin:10px 0}summary{cursor:pointer;padding:8px}.barrow{display:grid;grid-template-columns:90px 1fr 45px;gap:7px;align-items:center;margin:8px 0}.barrow div{background:#e7eef4;height:12px;border-radius:6px}.barrow i{display:block;background:#16749e;height:12px;border-radius:6px}</style></head><body><header><div><h1>💪 나의 5분할 운동 코치</h1><div class="sub">사진 속 8주 프로그램 · 운동 자세 안내 · 세트별 운동 기록</div></div></header><main><section class="panel"><label>운동 날짜 <input id="workdate" type="date"></label><button class="action" onclick="today()">오늘</button><div class="actions"><button class="action" onclick="showHistory()">운동 일지 / 통계</button><button class="action secondary" onclick="exportCSV()">엑셀 CSV</button><button class="action secondary" onclick="backup()">백업</button><button class="action secondary" onclick="document.getElementById('restore').click()">복원</button><input id="restore" type="file" accept=".json,application/json" hidden></div></section><section id="history" class="panel" hidden></section><nav class="days" id="days"></nav><section class="summary" id="summary"></section><div id="content"></div><footer>운동 그림은 이해를 돕는 간략한 도식입니다. 실제 기구와 자세는 다를 수 있습니다. 통증이 있으면 중단하세요.<br>기록은 현재 브라우저의 로컬 저장소에 저장됩니다.</footer></main><script>
const raw={
0:[['하체','맨몸 스쿼트',7],['하체','레그 프레스',4],['하체','레그 익스텐션',5],['하체','핵 스쿼트',4],['하체','레그 컬',5],['하체','바벨 런지',4],['복근','크런치',5],['복근','인클라인 벤치 싯업',5],['복근','행잉 레그 레이즈',5]],
1:[['가슴','인클라인 덤벨 프레스',4],['가슴','인클라인 바벨 프레스',4],['가슴','플랫 벤치 프레스',7],['가슴','덤벨 플라이 / 리버스 펙 덱 플라이',4],['가슴','딥스',5],['가슴','케이블 크로스오버',4],['종아리','카프 레이즈',10]],
2:[],
3:[['등','랫 풀다운 / 풀업',5],['등','암 풀다운',4],['등','벤트 오버 바벨 로우',5],['등','T바 로우',5],['등','루마니안 데드리프트',4],['등','원 암 덤벨 로우',4],['등','시티드 로우',5],['복근','크런치',5],['복근','인클라인 벤치 싯업',5],['복근','행잉 레그 레이즈',5]],
4:[['어깨','덤벨 숄더 프레스',4],['어깨','비하인드 넥 프레스',4],['어깨','시티드 프론트 프레스',5],['어깨','사이드 레터럴 레이즈',5],['어깨','벤트 오버 레이즈 / 페이스 풀',5],['어깨','업라이트 로우',4],['어깨','덤벨 슈러그',7]],
5:[['팔','케이블 컬 + 케이블 푸시다운',4],['팔','프리처 컬 + 라잉 트라이셉스 익스텐션',4],['팔','스탠딩 바벨 컬 + 원 암 덤벨 오버헤드 익스텐션',4],['팔','얼터네이트 덤벨 컬 + 스탠딩 트라이셉스 익스텐션',4],['복근','크런치',5],['복근','인클라인 벤치 싯업',5],['복근','행잉 레그 레이즈',5]],
6:[]};
const days=['월요일','화요일','수요일','목요일','금요일','토요일','일요일'];
const notes={
'맨몸 스쿼트':['발을 어깨너비로 벌리고 발끝을 약간 바깥으로 향합니다.','엉덩이를 뒤로 보내며 무릎과 고관절을 함께 굽힙니다.','발바닥 전체로 밀어 일어서고 허리를 중립으로 유지합니다.'],
'레그 프레스':['등과 엉덩이를 패드에 붙이고 발을 발판에 둡니다.','허리가 말리지 않는 범위까지 무릎을 굽힙니다.','발판을 밀되 무릎을 강하게 잠그지 않습니다.'],
'레그 익스텐션':['무릎 축을 기계 회전축에 맞춥니다.','정강이 패드를 들어 무릎을 폅니다.','반동 없이 천천히 내립니다.'],
'핵 스쿼트':['등과 어깨를 패드에 고정합니다.','무릎과 발끝이 같은 방향으로 움직이게 앉습니다.','발 전체로 밀어 올라옵니다.'],
'레그 컬':['무릎과 기계 축을 맞추고 패드를 발목 근처에 둡니다.','허벅지를 고정한 채 무릎을 굽힙니다.','천천히 시작 위치로 돌아갑니다.'],
'바벨 런지':['바벨을 등 위에 안정적으로 얹고 몸통을 세웁니다.','한발을 내디뎌 양 무릎을 굽힙니다.','앞발로 밀어 돌아오며 좌우를 번갈아 합니다.'],
'크런치':['누워 무릎을 굽히고 허리를 과하게 꺾지 않습니다.','복부를 수축해 어깨를 살짝 들어 올립니다.','목을 잡아당기지 말고 천천히 내립니다.'],
'인클라인 벤치 싯업':['경사 벤치에 발을 고정하고 앉습니다.','복부에 힘을 주어 몸통을 세웁니다.','허리에 부담이 없는 범위로 천천히 내려갑니다.'],
'행잉 레그 레이즈':['철봉에 매달려 몸의 흔들림을 줄입니다.','골반을 말아 올리며 무릎이나 다리를 들어 올립니다.','반동 없이 천천히 내립니다.'],
'딥스':['평행봉을 잡고 어깨를 안정시킵니다.','팔꿈치를 굽혀 통증 없는 범위까지 내려갑니다.','팔을 펴서 올라오되 어깨가 과하게 앞으로 말리지 않게 합니다.'],
'카프 레이즈':['발 앞부분을 발판에 올리고 균형을 잡습니다.','발뒤꿈치를 최대한 자연스럽게 들어 올립니다.','반동 없이 천천히 내립니다.'],
'루마니안 데드리프트':['무릎을 살짝 굽히고 바벨을 몸 가까이 둡니다.','엉덩이를 뒤로 밀며 고관절을 접습니다.','등의 중립을 유지하고 엉덩이 힘으로 일어납니다.'],
'덤벨 슈러그':['덤벨을 몸 옆에 두고 팔을 편 상태를 유지합니다.','어깨를 귀 방향으로 곧게 들어 올립니다.','어깨를 돌리지 말고 천천히 내립니다.']};
function guidance(name){if(notes[name])return notes[name];let n=name.toLowerCase();if(n.includes('프레스'))return ['손목을 곧게 하고 등과 몸통을 안정적으로 고정합니다.','무게를 통제하며 밀어 올리고 관절을 과도하게 잠그지 않습니다.','천천히 시작 위치로 돌아오며 어깨 통증을 피합니다.'];if(n.includes('로우')||n.includes('풀다운')||n.includes('풀업'))return ['허리를 중립으로 유지하고 어깨를 안정시킵니다.','팔보다 등 근육을 의식하며 손잡이를 몸 쪽으로 당깁니다.','반동 없이 천천히 팔을 펴서 돌아갑니다.'];if(n.includes('컬'))return ['팔꿈치를 몸 가까이에 고정합니다.','반동 없이 팔꿈치를 굽혀 중량을 올립니다.','천천히 내려 이두근의 긴장을 유지합니다.'];if(n.includes('레이즈')||n.includes('플라이'))return ['가벼운 무게로 시작하고 몸통을 고정합니다.','어깨에 통증 없는 범위에서 팔을 움직입니다.','반동 없이 천천히 돌아옵니다.'];return ['기구의 높이와 몸의 위치를 조절합니다.','관절에 무리가 없는 범위에서 천천히 동작합니다.','호흡을 유지하고 반동 없이 제어합니다.']}
function kind(n){if(/스쿼트|런지|레그 프레스|레그 익스텐션|레그 컬/.test(n))return 'leg';if(/크런치|싯업|레그 레이즈/.test(n))return 'core';if(/데드리프트|로우|풀다운|풀업/.test(n))return 'pull';if(/컬|익스텐션|푸시다운/.test(n))return 'arm';if(/카프/.test(n))return 'calf';if(/슈러그|레이즈|플라이|크로스오버/.test(n))return 'raise';return 'press'}
function diagram(n){let k=kind(n);let p={leg:[[135,68,135,116,120,160,105,200],[135,68,140,116,165,146,185,198]],core:[[110,140,152,140,174,164,197,190],[110,125,145,100,173,145,197,190]],pull:[[125,70,135,125,125,178,125,205],[125,70,135,125,125,178,125,205]],arm:[[130,75,130,130,125,180,125,207],[130,75,130,130,125,180,125,207]],calf:[[130,75,130,128,130,175,120,205],[130,75,130,128,130,175,120,198]],raise:[[130,75,130,130,125,180,125,207],[130,75,130,130,125,180,125,207]],press:[[130,75,130,130,125,180,125,207],[130,75,130,130,125,180,125,207]]}[k];let arms={leg:[[[135,98],[100,125],[78,125]],[[140,100],[110,130],[90,130]]],core:[[[135,145],[120,130],[105,130]],[[135,115],[120,105],[100,110]]],pull:[[[130,98],[90,72],[75,40]],[[130,98],[93,110],[77,130]]],arm:[[[130,100],[95,130],[85,163]],[[130,100],[95,130],[85,98]]],calf:[[[130,100],[100,135],[100,165]],[[130,100],[100,135],[100,165]]],raise:[[[130,100],[105,125],[95,150]],[[130,100],[92,88],[65,82]]],press:[[[130,100],[100,115],[90,140]],[[130,100],[95,70],[90,37]]]}[k];function figure(i,shift){let a=p[i],b=arms[i];return `<g transform="translate(${shift},0)" stroke="#1e6086" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="${a[0]}" cy="${a[1]-22}" r="17" fill="#b8ddec" stroke="#1e6086" stroke-width="5"/><path d="M${a[0]} ${a[1]} L${a[2]} ${a[3]} L${a[4]} ${a[5]} L${a[6]} ${a[7]}"/><path d="M${a[2]} ${a[3]} L${a[4]+30} ${a[5]} L${a[6]+36} ${a[7]}"/><path d="M${b[0][0]} ${b[0][1]} L${b[1][0]} ${b[1][1]} L${b[2][0]} ${b[2][1]}"/><path d="M${b[0][0]+10} ${b[0][1]} L${b[1][0]+45} ${b[1][1]} L${b[2][0]+45} ${b[2][1]}"/></g>`}return `<svg viewBox="0 0 560 240" role="img" aria-label="${n} 시작과 마무리 자세를 단순화한 그림"><rect x="4" y="4" width="268" height="232" rx="14" fill="#e1eff8"/><rect x="288" y="4" width="268" height="232" rx="14" fill="#d6eee9"/>${figure(0,0)}${figure(1,280)}<g fill="#174866" font-size="15" font-weight="700"><text x="20" y="26">① 시작</text><text x="304" y="26">② 동작</text></g><path d="M266 120 l18 0" stroke="#0f7899" stroke-width="3"/></svg>`}
let current=(new Date().getDay()+6)%7;let openKey=null;const storeKey='fitness-five-split-v1';let records={};try{records=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{};function save(){localStorage.setItem(storeKey,JSON.stringify(records))}function key(d,i,s){return selectedDate+'-'+d+'-'+i+'-'+s}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.getElementById('days').innerHTML=days.map((d,i)=>`<button class="day ${i===current?'active':''}" onclick="pick(${i})">${d}</button>`).join('');let items=raw[current],total=items.reduce((a,x)=>a+x[2],0),done=items.reduce((a,x,i)=>a+Array.from({length:x[2]},(_,s)=>records[key(current,i,s)]?.done?1:0).reduce((a,b)=>a+b,0),0);document.getElementById('summary').innerHTML=`<div style="flex:1"><b>${days[current]} · ${items.length?Array.from(new Set(items.map(x=>x[0]))).join(' + '):'회복일'}</b><div class="muted">${items.length?`${items.length}종목 · ${done}/${total}세트 완료`:'휴식 또는 가벼운 유산소'}</div><div class="progress"><div style="width:${total?100*done/total:0}%"></div></div></div><b style="font-size:24px;color:#127c99">${total?Math.round(done/total*100):0}%</b>`;document.getElementById('content').innerHTML=items.length?items.map((x,i)=>{let id=current+'-'+i,opened=openKey===id;return `<article class="exercise"><button class="exercise-head" onclick="toggle(${i})"><span><strong>${i+1}. ${esc(x[1])}</strong><small>${x[0]} · 권장 ${x[2]}세트</small></span><span class="pill">${opened?'접기 ▲':'자세 보기 ▼'}</span></button>${opened?`<div class="detail"><div class="figure">${diagram(x[1])}</div><div class="muted">※ 그림은 동작 유형을 나타내는 개략도이며, 해당 운동의 정확한 기구·궤적을 재현한 그림은 아닙니다.</div><div class="tip"><b>운동 방법</b><ol>${guidance(x[1]).map(t=>`<li>${t}</li>`).join('')}</ol></div><div class="muted">${previous(current,i)}</div><h4>세트 기록 <span class="muted">(kg / 회)</span></h4>${Array.from({length:x[2]},(_,s)=>{let r=records[key(current,i,s)]||{};return `<div class="setrow"><b>${s+1}세트</b><input type="number" min="0" step="0.5" placeholder="무게 kg" value="${r.weight??''}" onchange="setval(${i},${s},'weight',this.value)"><input type="number" min="0" step="1" placeholder="횟수" value="${r.reps??''}" onchange="setval(${i},${s},'reps',this.value)"><button class="${r.done?'done':''}" onclick="complete(${i},${s})">${r.done?'✓ 완료':'완료'}</button></div>`}).join('')}<div class="actions"><button class="action" onclick="allDone(${i})">이 운동 전체 완료</button><button class="action secondary" onclick="resetEx(${i})">기록 초기화</button></div></div>`:''}</article>`}).join(''):`<div class="panel rest"><h2>🌿 회복하는 날</h2><p>가벼운 걷기, 스트레칭 또는 충분한 휴식을 권장합니다.</p></div>`}function pick(i){current=i;openKey=null;render()}function toggle(i){let k=current+'-'+i;openKey=openKey===k?null:k;render()}function setval(i,s,f,v){let k=key(current,i,s);records[k]??={};records[k][f]=v;save()}function complete(i,s){let k=key(current,i,s);records[k]??={};records[k].done=!records[k].done;save();render()}function allDone(i){for(let s=0;s<raw[current][i][2];s++){let k=key(current,i,s);records[k]??={};records[k].done=true}save();render()}function resetEx(i){if(!confirm('이 운동의 선택 날짜 기록을 삭제할까요?'))return;for(let s=0;s<raw[current][i][2];s++)delete records[key(current,i,s)];save();render()}
let selectedDate=new Date().toLocaleDateString('sv-SE');
const dateInput=document.getElementById('workdate');dateInput.value=selectedDate;
function chooseDate(v){if(!v)return;selectedDate=v;dateInput.value=v;current=(new Date(v+'T12:00:00').getDay()+6)%7;openKey=null;render();refreshHistory()}
dateInput.onchange=()=>chooseDate(dateInput.value);function today(){chooseDate(new Date().toLocaleDateString('sv-SE'))}
function rows(){return Object.entries(records).flatMap(([k,r])=>{let m=/^(\d{4}-\d{2}-\d{2})-(\d+)-(\d+)-(\d+)$/.exec(k);if(!m||!r)return [];let [,date,d,i,t]=m,x=raw[d]?.[i];if(!x||+t>=x[2]||(!r.done&&(r.weight==null||r.weight==='')&&(r.reps==null||r.reps==='')))return [];return [{date,d:+d,i:+i,set:+t+1,name:x[1],weight:r.weight??'',reps:r.reps??'',done:!!r.done}] }).sort((a,b)=>a.date.localeCompare(b.date)||a.d-b.d||a.i-b.i||a.set-b.set)}
function previous(d,i){let name=raw[d][i][1],a=rows().filter(r=>r.name===name&&r.date<selectedDate&&r.done);if(!a.length)return '지난 완료 기록 없음';let date=a.at(-1).date;return '지난 운동 ('+date+'): '+a.filter(r=>r.date===date).map(r=>r.set+'세트 '+(r.weight===''?'—':r.weight)+'kg × '+(r.reps===''?'—':r.reps)+'회').join(' / ')}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(){let q=v=>'"'+String(v).replaceAll('"','""')+'"';download('운동기록.csv','\ufeff'+[['날짜','요일 프로그램','운동','세트','중량 kg','횟수','완료'],...rows().map(r=>[r.date,days[r.d],r.name,r.set,r.weight,r.reps,r.done?'완료':'미완료'])].map(a=>a.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){download('운동기록-'+selectedDate+'.json',JSON.stringify({version:1,records},null,2),'application/json')}
document.getElementById('restore').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text()),v=o.records;if(!v||typeof v!=='object'||Array.isArray(v))throw Error();let clean={};for(let [k,r] of Object.entries(v)){let m=/^(\d{4}-\d{2}-\d{2})-(\d+)-(\d+)-(\d+)$/.exec(k);if(!m||!raw[m[2]]?.[m[3]]||+m[4]>=raw[m[2]][m[3]][2]||!r||typeof r!=='object')throw Error();let a={done:r.done===true};for(let f of ['weight','reps'])if(r[f]!=null&&r[f]!==''){if(!/^\d+(\.\d+)?$/.test(String(r[f]))||!Number.isFinite(Number(r[f])))throw Error();a[f]=String(r[f])}clean[k]=a}if(confirm('백업을 합칠까요? 같은 날짜·세트는 백업 기록으로 교체됩니다.')){records={...records,...clean};save();render();refreshHistory();alert('복원 완료')}}catch{alert('백업 파일을 읽을 수 없습니다.')}finally{e.target.value=''}};
let historyMonth=selectedDate.slice(0,7),historyName='';const hist=document.getElementById('history');function showHistory(){hist.hidden=!hist.hidden;if(!hist.hidden)refreshHistory()}
function refreshHistory(){if(hist.hidden)return;let all=rows(),month=all.filter(r=>r.date.startsWith(historyMonth)),completed=month.filter(r=>r.done),start=new Date(selectedDate+'T12:00:00');start.setDate(start.getDate()-(start.getDay()+6)%7);let end=new Date(start);end.setDate(end.getDate()+6);let week=all.filter(r=>r.done&&r.date>=start.toLocaleDateString('sv-SE')&&r.date<=end.toLocaleDateString('sv-SE'));let names=[...new Set(Object.values(raw).flat().map(x=>x[1]))];if(!historyName)historyName=names[0];let dates=[...new Set(month.map(r=>r.date))].reverse();let volume=a=>a.reduce((n,r)=>n+Number(r.weight)*Number(r.reps),0);hist.innerHTML=`<h2>운동 일지 및 통계</h2><label>조회 월 <input type="month" value="${historyMonth}" onchange="historyMonth=this.value;refreshHistory()"></label><p>월간: ${new Set(completed.map(r=>r.date)).size}일 · ${completed.length} 완료 세트 · ${volume(completed).toLocaleString()} kg 총 중량</p><p>선택 날짜 기준 주간: ${new Set(week.map(r=>r.date)).size}일 · ${week.length} 완료 세트 · ${volume(week).toLocaleString()} kg 총 중량</p><div class="calendar">${calendar(month)}</div><h3>날짜별 기록</h3>${dates.map(d=>`<details ${d===selectedDate?'open':''}><summary>${d}</summary><button class="action secondary" onclick="chooseDate('${d}')">이 날짜 기록 수정</button><div class="tablewrap"><table><tr><th>운동</th><th>세트</th><th>kg</th><th>회</th><th>완료</th></tr>${month.filter(r=>r.date===d).map(r=>`<tr><td>${esc(r.name)}</td><td>${r.set}</td><td>${esc(String(r.weight))}</td><td>${esc(String(r.reps))}</td><td>${r.done?'✓':'—'}</td></tr>`).join('')}</table></div></details>`).join('')||'<p>기록 없음</p>'}<h3>종목별 변화 (전체 기간)</h3><select onchange="historyName=this.value;refreshHistory()">${names.map(n=>`<option ${n===historyName?'selected':''}>${esc(n)}</option>`).join('')}</select>${trend(all)}`}
function calendar(month){let [y,m]=historyMonth.split('-').map(Number);if(!y||!m)return '';let first=new Date(y,m-1,1).getDay(),count=new Date(y,m,0).getDate();return ['일','월','화','수','목','금','토'].map(d=>`<span>${d}</span>`).join('')+'<span></span>'.repeat(first)+Array.from({length:count},(_,i)=>{let d=historyMonth+'-'+String(i+1).padStart(2,'0');return `<button class="${month.some(r=>r.date===d)?'marked':''}" onclick="chooseDate('${d}')">${i+1}</button>`}).join('')}
function trend(all){let a=all.filter(r=>r.name===historyName&&r.done),dates=[...new Set(a.map(r=>r.date))];if(!dates.length)return '<p>완료 기록 없음</p>';let metrics=dates.map(d=>{let b=a.filter(r=>r.date===d);return {date:d,kg:Math.max(0,...b.map(r=>Number(r.weight))),reps:b.reduce((n,r)=>n+Number(r.reps),0)}});return ['kg','reps'].map(f=>{let max=Math.max(1,...metrics.map(r=>r[f]));return `<h4>${f==='kg'?'최고 중량 (kg)':'총 반복 횟수 (회)'}</h4>${metrics.map(r=>`<div class="barrow"><small>${r.date}</small><div><i style="width:${r[f]/max*100}%"></i></div><b>${r[f]}</b></div>`).join('')}`}).join('')}
const originalSave=save;save=function(){originalSave();refreshHistory()};render();

</script></body></html>
